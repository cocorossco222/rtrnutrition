/* ==================================================================
   RTR NUTRITION COMPANION · Phase 1 STABILISE · prototype p1

   Palette, radius, motion and ink tiers are inherited verbatim from
   RTR_Nutrition_Master v2.2(a) so the Companion and the client-facing
   pitch read as one product.

   Ground rules, carried over:
     paper is the default. Forest is punctuation, not atmosphere.
     Sage = living / affirmative. Terracotta = priority / caution.
     Brass = rare detail only.

   Companion-specific addition: the serif is the COACHING VOICE.
   It is used for the daily read and for curiosity notes, and nowhere
   else. Everything the interface says about itself is set in sans.
   That split is what keeps this from feeling like a calorie tracker.

   No scores. No percentages. No streak punishment. No red.
   ================================================================== */

:root{
  /* --- paper ground --- */
  --paper:#FBF8F2;
  --paper-oat:#F3EEE2;
  --card:#FFFEFA;

  /* --- ink · three deliberate tiers ---
     P2.2b: ink-3 and the coloured text tiers were darkened when the
     phoenix watermark was strengthened. Small text now sits over a
     visible mark, and every tier still clears WCAG AA against it. */
  --ink:#1F2620;
  --ink-2:#4C554A;
  --ink-3:#555D53;

  /* --- rules & edges --- */
  --rule:#E6DECD;
  --rule-2:#D6CBB2;

  /* --- forest · punctuation --- */
  --forest:#1B2A21;
  --forest-2:#22342A;

  /* --- sage · living --- */
  --sage:#4C7C57;
  --sage-txt:#35603F;
  --sage-lite:#93C29A;
  --sage-wash:rgba(76,124,87,.07);
  --sage-edge:rgba(76,124,87,.26);

  /* --- terracotta · priority (never "bad") --- */
  --terra:#AE5A32;
  --terra-txt:#8C4522;
  --terra-wash:rgba(174,90,50,.06);
  --terra-edge:rgba(174,90,50,.24);

  /* --- brass · restraint required --- */
  --brass:#9C7F42;
  --brass-txt:#6E5829;
  --brass-wash:rgba(156,127,66,.07);

  /* --- the phoenix, pressed into the paper --- */
  --phx-ink:#E3D9C4;
  --phx-lift:#FFFFFF;
  --phx-dark:rgba(243,239,227,.90);

  /* --- shadow · warm, never neutral grey --- */
  --lift:0 1px 2px rgba(74,60,32,.05), 0 10px 26px -18px rgba(74,60,32,.30);
  --lift-2:0 2px 5px rgba(74,60,32,.06), 0 20px 44px -26px rgba(74,60,32,.38);

  --radius:22px;
  --radius-s:14px;
  --tap:46px;
  --pad:20px;

  --e-out:cubic-bezier(.22,1,.36,1);
  --e-in-out:cubic-bezier(.4,0,.2,1);
  --e-spring:cubic-bezier(.34,1.32,.5,1);
  --t-press:130ms;
  --t-micro:180ms;
  --t-ui:260ms;

  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;

  --barh:64px;

  /* --- brand · the phoenix, carried across from the pitch pages --- */

*,*::before,*::after{box-sizing:border-box;}

/* An id selector setting `display` outbeats the browser's own
   [hidden]{display:none}. Without this line #app stays on screen
   during onboarding and the client sees an empty shell. */
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2.5px solid var(--sage);outline-offset:3px;border-radius:6px;}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* ---------- brand · the phoenix pressed into the paper ----------
   P2.2b: the drifting holographic ghost is gone. This is a still
   watermark now — a white impression offset beneath a warm tone,
   which is how a mark pressed into paper actually reads. No
   animation, no blur, nothing repainting. It is strong enough to be
   seen, and every ink tier above was darkened to clear AA over it. */
.bg-phx{position:fixed;inset:0;z-index:0;pointer-events:none;
  display:grid;place-items:center;overflow:hidden;}
.bg-phx::before,.bg-phx::after{
  content:"";grid-area:1/1;
  width:min(84vw,455px);aspect-ratio:150/127;
  -webkit-mask:var(--phx-mark) center/contain no-repeat;
          mask:var(--phx-mark) center/contain no-repeat;
}
/* the lift sits just below and right, so the edges catch the light */
.bg-phx::before{
  background:var(--phx-lift);
  transform:translateY(-4vh) translate(2.5px,3px);
}
.bg-phx::after{
  background:linear-gradient(163deg,#EAE1CF 0%,var(--phx-ink) 46%,#DCD0B7 74%,#E8DFCB 100%);
  transform:translateY(-4vh);
}

/* ---------- app frame ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1;}
.appbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  background:rgba(251,248,242,.86);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--rule);
}
.ab-mark{
  width:26px;height:26px;flex:none;background:var(--sage);
  -webkit-mask:var(--phx-mark) center/contain no-repeat;
  mask:var(--phx-mark) center/contain no-repeat;
}
.phx-hero{
  width:52px;height:52px;background:var(--sage);margin-bottom:18px;
  -webkit-mask:var(--phx-mark) center/contain no-repeat;
  mask:var(--phx-mark) center/contain no-repeat;
}
.ab-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.ab-1{font-size:13.5px;font-weight:750;letter-spacing:.01em;}
.ab-2{font-size:10.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--sage-txt);}
.ab-act{margin-left:auto;display:flex;gap:6px;}
.iconbtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--rule);
  background:var(--card);display:grid;place-items:center;color:var(--ink-2);
  transition:transform var(--t-press) var(--e-out),border-color var(--t-micro);
}
.iconbtn:active{transform:scale(.94);}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}

main{flex:1;padding:0 var(--pad) calc(var(--barh) + env(safe-area-inset-bottom) + 30px);}
.wrap{max-width:600px;margin:0 auto;}

/* ---------- tab bar ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);
  background:rgba(251,248,242,.93);
  backdrop-filter:saturate(1.4) blur(16px);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--rule);
}
.tab{
  border:none;background:none;padding:7px 2px 5px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;font-weight:650;letter-spacing:.02em;
  transition:color var(--t-micro);min-height:var(--tap);
}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t-micro) var(--e-spring);}
.tab[aria-current="page"]{color:var(--sage-txt);}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.06);}
.tab:active svg{transform:scale(.9);}

/* ---------- type ---------- */
.eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;display:flex;align-items:center;gap:9px;
}
.eyebrow .sep{flex:1;height:1px;background:var(--rule);}
h1.big{font-size:clamp(25px,7.4vw,32px);line-height:1.14;letter-spacing:-.022em;
  font-weight:730;margin:0 0 6px;}
h2.sh{font-size:19px;line-height:1.24;letter-spacing:-.015em;font-weight:720;margin:0 0 8px;}
h3.ch{font-size:15.5px;line-height:1.3;letter-spacing:-.008em;font-weight:700;margin:0 0 5px;}
p{margin:0 0 12px;}
p:last-child{margin-bottom:0;}
.lede{color:var(--ink-2);font-size:15px;}
.small{font-size:13px;color:var(--ink-3);line-height:1.45;}
.voice{font-family:var(--serif);font-weight:400;letter-spacing:-.004em;}
.sect{padding:26px 0 4px;}
.sect + .sect{padding-top:14px;}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  padding:18px;box-shadow:var(--lift);
}
.card + .card{margin-top:12px;}
.card.oat{background:rgba(243,238,226,.94);box-shadow:none;}
.card.flat{box-shadow:none;}
.card.spine{position:relative;overflow:hidden;padding-left:21px;}
.card.spine::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sage);}
.card.spine.terra::before{background:var(--terra);}
.card.spine.brass::before{background:var(--brass);}

/* ---------- buttons ---------- */
.btn{
  border:none;border-radius:var(--radius-s);padding:15px 20px;min-height:var(--tap);
  font-size:15px;font-weight:730;letter-spacing:-.005em;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  transition:transform var(--t-press) var(--e-out),background var(--t-micro),opacity var(--t-micro);
  width:100%;
}
.btn:active{transform:scale(.978);}
.btn.primary{background:var(--forest);color:#F3EFE3;box-shadow:var(--lift);}
.btn.sage{background:var(--sage);color:#fff;box-shadow:var(--lift);}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule-2);}
.btn.quiet{background:var(--paper-oat);color:var(--ink-2);font-weight:680;font-size:14px;
  padding:12px 16px;min-height:42px;}
.btn.sm{width:auto;padding:10px 15px;min-height:40px;font-size:13.5px;border-radius:11px;}
.btn[disabled]{opacity:.42;pointer-events:none;}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;}
.btnrow .btn{width:auto;flex:1 1 auto;}

/* ---------- segmented choice (the tracker's heart) ---------- */
.metric{border-top:1px solid var(--rule);padding:16px 0 15px;}
.metric:first-of-type{border-top:none;padding-top:2px;}
.m-head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;}
.m-title{font-size:15.5px;font-weight:700;letter-spacing:-.008em;}
.m-why{
  margin-left:auto;border:none;background:none;padding:4px 6px;margin-right:-6px;
  color:var(--ink-3);font-size:12px;font-weight:650;display:flex;align-items:center;gap:4px;
  border-radius:8px;min-height:30px;
}
.m-why svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;}
.m-ask{font-size:13.5px;color:var(--ink-3);margin:0 0 11px;line-height:1.4;}
.m-note{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows var(--t-ui) var(--e-in-out);
}
.m-note.open{grid-template-rows:1fr;}
/* the clip layer must be bare — any padding or border here survives
   the collapse and shows as a sliver of cut-off text */
.m-note-clip{overflow:hidden;min-height:0;}
.m-note-in{
  background:var(--sage-wash);border:1px solid var(--sage-edge);border-radius:12px;
  padding:11px 13px;margin:0 0 11px;font-size:13px;line-height:1.45;color:var(--ink-2);
}
.seg{display:grid;gap:7px;grid-auto-flow:column;grid-auto-columns:1fr;}
.seg.wrap2{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));}
.opt{
  border:1px solid var(--rule-2);background:var(--card);border-radius:13px;
  padding:13px 6px;min-height:var(--tap);
  font-size:14px;font-weight:670;color:var(--ink-2);text-align:center;
  transition:transform var(--t-press) var(--e-out),background var(--t-micro),
             border-color var(--t-micro),color var(--t-micro);
}
.opt:active{transform:scale(.95);}
.opt[aria-pressed="true"]{
  background:var(--forest);border-color:var(--forest);color:#F3EFE3;font-weight:720;
}
.opt.lv1[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);}
.opt.lv2[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);}
.opt.lv3[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.chip{
  border:1px solid var(--rule-2);background:var(--card);border-radius:999px;
  padding:9px 14px;min-height:40px;font-size:13.5px;font-weight:640;color:var(--ink-2);
  transition:transform var(--t-press) var(--e-out),background var(--t-micro),border-color var(--t-micro);
}
.chip:active{transform:scale(.95);}
.chip[aria-pressed="true"]{background:var(--terra-wash);border-color:var(--terra-edge);color:var(--terra-txt);font-weight:700;}
.reveal{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows var(--t-ui) var(--e-in-out);}
.reveal.open{grid-template-rows:1fr;}
/* one child only — a second child creates an implicit auto row that
   never collapses, which would leave the symptom chips always visible */
.reveal-clip{overflow:hidden;min-height:0;}

textarea.note{
  width:100%;border:1px solid var(--rule-2);background:var(--card);border-radius:13px;
  padding:13px;font-size:15px;line-height:1.45;resize:vertical;min-height:84px;
}
textarea.note::placeholder{color:var(--ink-3);}
input.num{
  width:100%;border:1px solid var(--rule-2);background:var(--card);border-radius:13px;
  padding:13px;font-size:16px;min-height:var(--tap);
}

/* ---------- today ---------- */
.greet{padding:24px 0 4px;}
.greet .d{font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px;}
.read{
  background:rgba(243,238,226,.93);
  backdrop-filter:saturate(1.2) blur(10px);
  -webkit-backdrop-filter:saturate(1.2) blur(10px);
  border:1px solid var(--rule);border-radius:var(--radius);
  padding:21px 20px;position:relative;
}
.read .tag{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brass-txt);margin-bottom:10px;}
.read h3{font-size:20px;line-height:1.2;letter-spacing:-.018em;font-weight:700;margin:0 0 10px;}
.read .body{font-family:var(--serif);font-size:16.5px;line-height:1.56;color:var(--ink-2);
  letter-spacing:-.003em;}
.try{
  margin-top:12px;background:var(--card);border:1px solid var(--sage-edge);
  border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;
  padding-left:21px;
}
.try::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sage);}
.try .tag{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--sage-txt);margin-bottom:6px;}
.try p{font-size:15.5px;font-weight:600;letter-spacing:-.008em;line-height:1.4;color:var(--ink);}

.donebar{
  display:flex;align-items:center;gap:11px;background:var(--sage-wash);
  border:1px solid var(--sage-edge);border-radius:var(--radius);padding:15px 17px;
}
.donebar svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--sage);stroke-width:2.1;
  stroke-linecap:round;stroke-linejoin:round;}
.donebar .t{font-size:14.5px;font-weight:700;}
.donebar .s{font-size:12.5px;color:var(--ink-3);}

/* ---------- curiosity note ----------
   This is the one ordinary-content surface allowed to become glass.
   The Curiosity Engine is the quiet intelligence under the paper, and
   it should look very slightly different from everything else. */
.note-card{
  background:linear-gradient(158deg,rgba(255,254,250,.86),rgba(243,238,226,.62));
  backdrop-filter:saturate(1.6) blur(18px);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);
  border:1px solid rgba(255,255,255,.62);
  box-shadow:var(--lift),inset 0 1px 0 rgba(255,255,255,.7);
  border-radius:var(--radius);
  padding:17px 18px 16px;position:relative;overflow:hidden;padding-left:21px;
}
.note-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass);z-index:2;}
.note-card.living::before{background:var(--sage);}
.note-card.watch::before{background:var(--terra);}
/* the mark reads through the glass, never through the words */
.note-card::after{
  content:"";position:absolute;right:-18px;bottom:-22px;width:98px;height:83px;
  background:var(--phx-ink);
  -webkit-mask:var(--phx-mark) center/contain no-repeat;
          mask:var(--phx-mark) center/contain no-repeat;
  opacity:.8;pointer-events:none;
}
.note-card > *{position:relative;z-index:1;}
.note-card .tag{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brass-txt);margin-bottom:8px;}
.note-card.living .tag{color:var(--sage-txt);}
.note-card.watch .tag{color:var(--terra-txt);}
.note-card .txt{font-family:var(--serif);font-size:16.5px;line-height:1.52;color:var(--ink);}
.note-card .basis{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.4;
  padding-top:9px;border-top:1px solid var(--rule);}
.note-card + .note-card{margin-top:10px;}

/* ---------- accumulation ---------- */
.accum{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
.acc{
  background:rgba(255,254,250,.90);
  border:1px solid rgba(230,222,205,.9);
  border-radius:var(--radius-s);padding:14px 15px;
}
.acc .n{font-size:26px;font-weight:730;letter-spacing:-.03em;line-height:1;color:var(--sage-txt);}
.acc .n.neutral{color:var(--ink);}
.acc .l{font-size:12.5px;color:var(--ink-3);margin-top:5px;line-height:1.32;}

/* ---------- trend strip ---------- */
.trend{display:flex;gap:3px;align-items:flex-end;height:52px;margin:10px 0 6px;}
.trend i{flex:1;border-radius:3px;background:var(--rule);min-width:4px;display:block;}
.trend i.g3{background:var(--sage);}
.trend i.g2{background:var(--sage-lite);}
.trend i.g1{background:var(--terra);opacity:.55;}
.trend i.g0{background:var(--rule);opacity:.6;}
.tlabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);}

/* ---------- list rows ---------- */
.row{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-s);
  padding:14px 15px;min-height:var(--tap);
  transition:transform var(--t-press) var(--e-out);
}
.row:active{transform:scale(.985);}
.row + .row{margin-top:8px;}
.row .rt{flex:1;min-width:0;}
.row .r1{display:block;font-size:14.5px;font-weight:680;letter-spacing:-.006em;}
.row .r2{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.4;}
.row .arw{color:var(--ink-3);font-size:19px;line-height:1;}
.pill{
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:5px 9px;border-radius:999px;white-space:nowrap;
}
.pill.est{background:var(--sage-wash);color:var(--sage-txt);border:1px solid var(--sage-edge);}
.pill.dev{background:var(--brass-wash);color:var(--brass-txt);border:1px solid rgba(156,127,66,.24);}
.pill.att{background:var(--terra-wash);color:var(--terra-txt);border:1px solid var(--terra-edge);}
.pill.new{background:var(--paper-oat);color:var(--ink-3);border:1px solid var(--rule-2);}

/* ---------- anchors (My Plan) ---------- */
.anchor{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--rule);}
.anchor > span:last-child{flex:1;min-width:0;}
.anchor:first-child{border-top:none;padding-top:2px;}
.anchor .n{
  width:27px;height:27px;flex:none;border-radius:9px;background:var(--sage-wash);
  border:1px solid var(--sage-edge);color:var(--sage-txt);
  display:grid;place-items:center;font-size:13px;font-weight:730;margin-top:1px;
}
.anchor .at{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;}
.anchor .ad{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.45;}

/* ---------- plate ---------- */
.plate{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.plate svg{width:min(132px,42vw);height:auto;aspect-ratio:1;flex:none;}
.plate .key{flex:1;min-width:150px;}
.pk{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:5px 0;color:var(--ink-2);}
.pk i{width:11px;height:11px;border-radius:3px;flex:none;}

/* ---------- report ---------- */
.rep-sec{border-top:1px solid var(--rule);padding:17px 0 4px;}
.rep-sec:first-child{border-top:none;padding-top:0;}
.rep-sec h4{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;
}
.rep-sec ul{margin:0;padding-left:18px;}
.rep-sec li{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin-bottom:6px;}
.rep-sec li::marker{color:var(--sage);}
.quote{
  font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink);
  border-left:2px solid var(--rule-2);padding-left:14px;margin:0;
}

/* ---------- sheet ---------- */
.sheetwrap{position:fixed;inset:0;z-index:80;display:none;}
.sheetwrap.open{display:block;}
.scrim{position:absolute;inset:0;background:rgba(27,42,33,.42);
  animation:fade var(--t-ui) var(--e-out);}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;
  background:rgba(251,248,242,.88);
  backdrop-filter:saturate(1.5) blur(22px);
  -webkit-backdrop-filter:saturate(1.5) blur(22px);
  border-radius:26px 26px 0 0;border-top:1px solid rgba(230,222,205,.9);
  padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 22px);
  animation:up 320ms var(--e-out);box-shadow:var(--lift-2);
}
.grip{width:38px;height:4px;border-radius:99px;background:var(--rule-2);margin:0 auto 14px;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--barh) + env(safe-area-inset-bottom) + 16px);
  transform:translateX(-50%);z-index:90;
  background:var(--forest);color:#F3EFE3;border-radius:13px;padding:12px 18px;
  font-size:14px;font-weight:650;box-shadow:var(--lift-2);
  animation:toastin 300ms var(--e-out);max-width:calc(100% - 40px);
}
@keyframes toastin{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- onboarding ---------- */
.ob{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 26px) var(--pad) calc(env(safe-area-inset-bottom) + 22px);}
.ob-in{flex:1;display:flex;flex-direction:column;max-width:600px;margin:0 auto;width:100%;}
.dots{display:flex;gap:5px;margin-bottom:22px;}
.dots i{height:3px;flex:1;border-radius:99px;background:var(--rule);transition:background var(--t-ui);}
.dots i.on{background:var(--sage);}
.ob-foot{margin-top:auto;padding-top:22px;}

/* ---------- misc ---------- */
.empty{
  border:1px dashed var(--rule-2);border-radius:var(--radius);padding:24px 20px;
  text-align:center;color:var(--ink-3);font-size:14px;line-height:1.5;background:var(--paper-oat);
}
.safety{
  background:var(--terra-wash);border:1px solid var(--terra-edge);border-radius:var(--radius-s);
  padding:14px 15px;font-size:13px;line-height:1.5;color:var(--ink-2);
}
.safety b{color:var(--terra-txt);}
.divider{height:1px;background:var(--rule);margin:22px 0;}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.tag-s{font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:999px;
  background:var(--paper-oat);color:var(--ink-3);border:1px solid var(--rule);}

/* ---------- Pass 2 · body check ---------- */
.bodyrow{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:13px 0;border-top:1px solid var(--rule);
}
.bodyrow:first-of-type{border-top:none;}
.bodyrow .bd{font-size:12.5px;color:var(--ink-3);min-width:92px;}
.bodyrow .bv{font-size:15px;font-weight:680;letter-spacing:-.006em;}
.bodyrow .bsep{color:var(--rule-2);}
.bodyrow .bedit{
  margin-left:auto;border:1px solid var(--rule-2);background:var(--card);
  border-radius:10px;padding:7px 12px;min-height:38px;
  font-size:13px;font-weight:650;color:var(--ink-2);
}
.unitseg{display:inline-flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
.unitopt{
  border:1px solid var(--rule-2);background:var(--card);border-radius:999px;
  padding:7px 13px;min-height:38px;font-size:13px;font-weight:650;color:var(--ink-2);
}
.unitopt[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#F3EFE3;}
.fieldrow{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;}
.fieldrow .fw{flex:1 1 110px;min-width:0;}
.fieldrow label{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:5px;}

/* ---------- Pass 2 · destructive actions, kept well away from the rest ---------- */
.danger{
  border:1px solid var(--terra-edge);border-radius:var(--radius);
  background:var(--terra-wash);padding:16px;margin-top:26px;
}
.danger h4{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--terra-txt);margin:0 0 9px;
}
.btn.danger-btn{background:var(--terra);color:#fff;}

/* ---------- Pass 2 · sheet close affordance ---------- */
.sheet-close{
  position:absolute;top:12px;right:14px;z-index:2;
  width:38px;height:38px;border-radius:11px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink-2);display:grid;place-items:center;
}
.sheet-close svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;}
.sheet{position:relative;}

/* ---------- Pass 2 · long content must never overflow sideways ---------- */
.note-card .txt,.note-card .basis,.row .r1,.row .r2,.quote,
.rep-sec li,.m-note-in,.read .body,.acc .l,.small,.lede,
.done h2,.done p,.notice .t,.notice .s{overflow-wrap:anywhere;}

/* ==================================================================
   P2.2 · PILOT POLISH
   Glass is used in four places only: the app bar, curiosity notes,
   the resolved-day panel and the personal welcome. Paper stays the
   default material everywhere else.
   ================================================================== */
.glass{
  background:linear-gradient(158deg,rgba(255,254,250,.84),rgba(243,238,226,.62));
  backdrop-filter:saturate(1.6) blur(18px);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);
  border:1px solid rgba(255,255,255,.62);
  box-shadow:var(--lift),inset 0 1px 0 rgba(255,255,255,.72);
}
.mark::after{
  content:"";position:absolute;right:-20px;bottom:-24px;width:112px;height:95px;
  background:var(--phx-ink);
  -webkit-mask:var(--phx-mark) center/contain no-repeat;
          mask:var(--phx-mark) center/contain no-repeat;
  opacity:.85;pointer-events:none;
}

/* ---------- the resolved day ----------
   P2.2b: once the check-in is in, Today changes material. The hero
   inverts to a dark sage ground so the state change is unmistakable
   at a glance, while everything below it stays on paper. The routes
   moved out of here entirely — see .tailroutes. Not a reward, not a
   streak, not a score. An endpoint. */
.done{
  position:relative;overflow:hidden;border-radius:var(--radius);
  padding:26px 22px 26px;
  background:linear-gradient(158deg,#35563E 0%,#294435 46%,#1D2E24 100%);
  border:1px solid rgba(147,194,154,.22);
  box-shadow:0 2px 6px rgba(29,46,36,.14),0 22px 46px -26px rgba(29,46,36,.55);
  color:#F5F1E6;
}
.done > *{position:relative;z-index:1;}
/* a paper phoenix, pressed into the dark instead of the light */
.done::after{
  content:"";position:absolute;right:-26px;bottom:-30px;width:186px;height:158px;
  background:var(--phx-dark);
  -webkit-mask:var(--phx-mark) center/contain no-repeat;
          mask:var(--phx-mark) center/contain no-repeat;
  opacity:.13;pointer-events:none;
}
.done .d{font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  color:rgba(245,241,230,.72);margin-bottom:8px;}
.done .tick{
  width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
  background:rgba(147,194,154,.16);border:1px solid rgba(147,194,154,.42);margin-bottom:16px;
}
.done .tick svg{width:23px;height:23px;fill:none;stroke:#B9D6BE;stroke-width:2.3;
  stroke-linecap:round;stroke-linejoin:round;}
.done h2{font-size:25px;line-height:1.16;letter-spacing:-.02em;font-weight:730;
  margin:0 0 9px;color:#F5F1E6;}
.done .say{font-family:var(--serif);font-size:17px;line-height:1.5;
  color:rgba(245,241,230,.86);margin:0;}
@keyframes settle{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes tickin{0%{transform:scale(.72);opacity:0}62%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
.done.flash{animation:settle 420ms var(--e-out);}
.done.flash .tick{animation:tickin 480ms var(--e-spring) 70ms both;}

/* ---------- the quiet routes, kept out of the way at the foot ---------- */
.tailroutes{margin-top:30px;padding-top:20px;border-top:1px solid var(--rule);}
.tailroutes .rlabel{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 11px;
}
.tailroutes .rgrid{display:flex;flex-wrap:wrap;gap:8px;}
.tailroutes .btn{width:auto;flex:0 1 auto;}

/* ---------- quiet notices ---------- */
.notice{position:relative;border-radius:var(--radius);padding:17px 19px;overflow:hidden;}
.notice > *{position:relative;z-index:1;}
.notice .t{font-size:15px;font-weight:720;letter-spacing:-.01em;margin:0 0 5px;}
.notice .s{font-size:14px;color:var(--ink-2);line-height:1.5;margin:0;}
.notice.terra{background:var(--terra-wash);border:1px solid var(--terra-edge);}
.notice.terra .t{color:var(--terra-txt);}

/* ---------- editing a day that isn't today ---------- */
.editbar{
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  background:var(--brass-wash);border:1px solid rgba(156,127,66,.24);
  border-radius:var(--radius-s);padding:12px 14px;margin-top:15px;
}
.editbar .et{font-size:13.5px;color:var(--ink-2);flex:1 1 150px;min-width:0;line-height:1.4;}
.editbar .btn{width:auto;flex:0 0 auto;}

/* ---------- a saved row, acknowledged ---------- */
@keyframes rowsave{0%{background:var(--sage-wash);border-color:var(--sage-edge)}
                   100%{background:var(--card);border-color:var(--rule)}}
.row.justsaved{animation:rowsave 1600ms var(--e-out) 120ms both;}

/* ---------- keyboard must never sit on top of the control ---------- */
.sheet input,.sheet textarea{scroll-margin-bottom:140px;scroll-margin-top:70px;}
main input,main textarea{scroll-margin-bottom:calc(var(--barh) + 120px);}

@media (min-width:620px){
  :root{--pad:28px;}
  .accum{grid-template-columns:repeat(3,1fr);}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition-duration:1ms !important;}
  /* the phoenix no longer moves at all, so there is nothing to disable */
}
</style>
</head>

<script>
"use strict";
/* ==================================================================
   RTR NUTRITION COMPANION — offline engine
   No network. No AI. localStorage only. All logic is rule-based and
   inspectable, because the coach has to be able to explain any note
   the app generates.
   ================================================================== */

/* ------------------------------------------------------------------
   1. MICRO-LEARNING LIBRARY
   Deliberately unnumbered. Rotation is by least-recently-seen, so a
   missed day costs nothing — the queue simply waits.
   ------------------------------------------------------------------ */
const LESSONS = [
{id:"consistency",theme:"Foundations",title:"The week beats the day",
 body:"One meal doesn't decide anything. What shapes your body and your energy is the pattern that repeats — the meals you eat most weeks, most days, without thinking hard about them. Perfect days are unreliable. Repeatable days are not. Aim to be broadly right often, rather than exactly right occasionally.",
 action:"Ask yourself what your last seven days looked like overall — not yesterday."},

{id:"rhythm",theme:"Foundations",title:"Your body likes a timetable",
 body:"Eating at roughly similar times helps appetite settle. When meals move around unpredictably, hunger arrives at awkward moments, and the food you reach for is whatever is closest rather than whatever you planned. Rhythm isn't rigidity. It's giving your day a shape you can rely on.",
 action:"Decide roughly when your next two meals will happen, before you get hungry."},

{id:"protein",theme:"Fundamentals",title:"Find the protein",
 body:"Protein is the part of a meal that keeps you full, supports muscle, and helps recovery. It's also the thing most often missing when a meal leaves you hunting for something an hour later. Meat, fish, eggs, dairy, beans, lentils, tofu — the source matters less than it being there at all.",
 action:"Before your next meal, name the protein out loud. If you can't, add one."},

{id:"hydration",theme:"Fundamentals",title:"Thirst is a quiet signal",
 body:"Mild dehydration rarely announces itself. It turns up as a flat afternoon, a headache, a sense that you want something without knowing what. Hydration is one of the easiest things to make automatic, because it attaches to things you already do — waking, meals, the kettle, the car.",
 action:"Attach a glass of water to something you already do every day."},

{id:"plants",theme:"Fundamentals",title:"Vegetables do the heavy lifting",
 body:"Vegetables and fruit bring fibre, water, vitamins and bulk — which means volume on the plate for relatively little energy. They're the simplest way to make a meal more filling without making it heavier. Frozen counts. Tinned counts. Bagged salad counts.",
 action:"Add one extra vegetable to your main meal today. Any vegetable."},

{id:"diversity",theme:"Gut",title:"Count plants, not calories",
 body:"Different plants feed different bacteria in your gut. Variety appears to matter more than quantity of any single food. Herbs, spices, nuts, seeds, beans, wholegrains and fruit all count as plants — which makes thirty different ones across a week far less daunting than it sounds.",
 action:"Count how many different plants you ate yesterday. Just as information."},

{id:"fibre",theme:"Gut",title:"Fibre is the part that isn't for you",
 body:"Most fibre passes through undigested — which is the point. It slows digestion, helps you feel full for longer, keeps things moving, and feeds the bacteria in your large intestine. Most people in the UK eat well under the recommended amount. Beans, oats, wholegrains, skins and seeds are the easiest additions.",
 action:"Leave the skin on something today."},

{id:"gut",theme:"Gut",title:"Your gut is worth listening to",
 body:"Digestion responds to food, stress, sleep, alcohol, routine and hydration — often all at once. That's why one uncomfortable day tells you very little, and three weeks of notes tell you a lot. You're not diagnosing anything. You're building a record clear enough to spot something real.",
 action:"Notice how your gut feels a couple of hours after your main meal today."},

{id:"microbiome",theme:"Gut",title:"What lives in there",
 body:"Your large intestine holds a large community of bacteria that ferment the fibre you can't digest. The research here is genuinely promising and genuinely unfinished — plenty is still unknown. What's reasonably well supported is unglamorous: more plants, more variety, more fibre, fewer heavily processed foods.",
 action:"Be sceptical of anything promising to fix your microbiome quickly."},

{id:"fermented",theme:"Gut",title:"Fermented foods, without the hype",
 body:"Yoghurt, kefir, sauerkraut, kimchi and live cheeses contain bacteria that survive fermentation. Some small studies suggest regular fermented food may support gut comfort and diversity. They aren't medicine and they won't undo a poor week — but a small daily portion is a low-cost habit with a reasonable case behind it.",
 action:"If fermented food is new to you, start small. A spoonful, not a bowl."},

{id:"kefir",theme:"Gut",title:"Why kefir earns its place",
 body:"Kefir is fermented milk, thinner than yoghurt and usually containing a wider range of bacteria and yeasts. It brings protein and calcium alongside that, which makes it more useful than most gut-focused foods. It's also a base rather than a meal — what you add to it decides what it does for you.",
 action:"Notice what you actually add to a kefir bowl, and why."},

{id:"hunger",theme:"Awareness",title:"Hunger has more than one cause",
 body:"Physical hunger builds slowly, sits in your body, and will accept most foods. The other kind arrives suddenly, sits in your head, and wants something specific. Neither is wrong — but they need different responses. Telling them apart takes about five seconds and changes what you do next.",
 action:"Next time you want food, ask whether an apple would do. The answer is informative."},

{id:"cravings",theme:"Awareness",title:"Cravings are information",
 body:"Cravings often cluster around predictable moments — late afternoon, after a hard day, in front of the television, after a short night. They pass, usually within twenty minutes, whether or not you act on them. Noticing when yours arrive tells you more than resisting them ever will.",
 action:"If a craving arrives today, note the time and what was happening."},

{id:"snacks",theme:"Awareness",title:"Snacks that serve me",
 body:"A snack isn't good or bad. It has a job. Some bridge a long gap. Some add protein or fibre you'd otherwise miss. Some are simply enjoyable, and that's a legitimate job too. The problem is only ever a snack that had no job — eaten because it was there.",
 action:"Before your next snack, ask what it's for. Then eat it anyway if you want to."},

{id:"energy",theme:"Awareness",title:"Energy is a pattern, not a mood",
 body:"An afternoon slump can come from a light lunch, a broken night, dehydration, a long gap between meals, or simply a hard day. On its own, one flat afternoon means nothing. Across a fortnight, low energy often lines up with something specific — and that's worth finding.",
 action:"When your energy dips today, note what your last meal was and when."},

{id:"sleep",theme:"Awareness",title:"Short nights change your appetite",
 body:"After poor sleep, appetite tends to rise and food choices tend to get quicker and heavier. That's a physiological response, not a character flaw. Knowing it's coming is most of the defence — a planned lunch on a tired day is worth more than willpower on a tired day.",
 action:"After a short night, decide your lunch before midday."},

{id:"quality",theme:"Foundations",title:"Closer to the original",
 body:"Food quality is less about strict categories and more about distance from the original ingredient. A potato, a chip and a crisp are all potato, but they behave very differently. You don't need to eliminate anything — you need most of your food to sit nearer the whole-food end most of the time.",
 action:"Pick one regular item and swap it for a less-processed version of the same thing."},

{id:"portions",theme:"Fundamentals",title:"Portions are a skill, not a rule",
 body:"You don't need scales to get portions broadly right — you need a reference. Your plate, your hand, the packet's actual serving. Most portion drift happens invisibly: bigger bowls, second helpings taken while distracted, oil poured rather than measured. Noticing is most of the correction.",
 action:"Serve your next meal onto the plate, then eat away from the pan."},

{id:"carbs",theme:"Fundamentals",title:"Carbohydrates aren't the problem",
 body:"Carbohydrate is your body's most convenient fuel, and cutting it out isn't required for fat loss. What matters far more is the type and the amount — wholegrain over refined where you can, and a portion that matches what your day actually demands. A training day and a desk day aren't the same.",
 action:"Match today's carbohydrate portion to how active today actually is."},

{id:"fats",theme:"Fundamentals",title:"Fat is useful and easy to over-pour",
 body:"Fat carries flavour, supports hormones, and helps you absorb some vitamins. It's also the most energy-dense thing on your plate — more than twice that of protein or carbohydrate per gram. Olive oil, nuts and avocado are genuinely good foods that still need measuring rather than eyeballing.",
 action:"Measure your cooking oil with a spoon once today, just to see."},

{id:"alcohol",theme:"Awareness",title:"What alcohol does to the day after",
 body:"Alcohol affects hydration, sleep quality, appetite and — for many people — gut comfort. The food decisions that follow tend to be quicker and less planned. This isn't an argument for abstinence. It's a reason to plan the next morning in advance rather than negotiate with yourself in it.",
 action:"If you drink today, decide tonight what breakfast will be."},

{id:"recover",theme:"Foundations",title:"Next meal, back on plan",
 body:"An off-plan meal costs almost nothing on its own. What costs something is the day and a half that sometimes follows it — the write-off, the compensating, the starting again on Monday. There's nothing to repair. The next meal is simply the next meal.",
 action:"If something goes off-plan today, make the next meal ordinary. Not corrective."},

{id:"build",theme:"Fundamentals",title:"Building a plate",
 body:"A workable default: half the plate vegetables or salad, a quarter protein, a quarter quality carbohydrate, plus a sensible amount of fat. It's a starting point, not a law. Mixed dishes — chilli, curry, soup, ragu — won't look like this at all, and don't need to. The proportions still apply inside the bowl.",
 action:"Look at your next plate and estimate the split. Don't change it. Just look."},

{id:"patterns",theme:"Awareness",title:"Reading your own patterns",
 body:"Individual days are noisy. Weeks are where patterns live. When you look back across a fortnight, the useful question isn't whether you did well — it's what tends to happen together. Low energy and skipped lunches. Rough gut and late meals. Those pairings are where the next adjustment comes from.",
 action:"Look back over your last week and find two things that happened together."},

{id:"tracking",theme:"Foundations",title:"Tracking without judgement",
 body:"You're not filing a report. Nothing here is marked, and nothing needs defending. A day recorded honestly as difficult is worth far more to you than a day recorded flatteringly — because only the honest one can show you anything. Record what happened, not what you meant to happen.",
 action:"Log today exactly as it was, including the parts you'd rather round up."},

{id:"change",theme:"Foundations",title:"Small, boring, repeated",
 body:"Changes that survive tend to be smaller than you'd like and duller than you'd hope. One habit, held for three weeks, will outperform five habits held for four days — every time. The goal isn't to be impressed by your plan. It's to still be doing it in March.",
 action:"Name the one habit you'd keep if you could only keep one."}
];

/* ------------------------------------------------------------------
   2. STORE  ·  schema v2

   The localStorage slot name is historical and deliberately unchanged,
   so a device already carrying Pass 1 data keeps it. The schema version
   lives INSIDE the payload, which is what migrations key off.

   Everything goes through the Store facade. Nothing else in the app
   touches localStorage directly — so swapping in IndexedDB later is a
   change to this object and nothing above it.
   ------------------------------------------------------------------ */
const KEY = "rtr.companion.v1";
const SCHEMA = 2;
const APP_VERSION = "p2.3";

/* ------------------------------------------------------------------
   2a. CLIENT CONFIGURATION
   The public codebase is client-neutral. A blank configured name uses
   the existing first-name capture during onboarding. Deployed identity
   will move to authenticated UUID-backed profile data; never commit a
   real client's identity into this file.
   ------------------------------------------------------------------ */
const CLIENT = { name:"" };
const ASK_NAME = !CLIENT.name;

const Store = {
  read(){  try{ return localStorage.getItem(KEY); }catch(e){ return null; } },
  write(s){ try{ localStorage.setItem(KEY, s); return true; }catch(e){ return false; } },
  clear(){ try{ localStorage.removeItem(KEY); }catch(e){} },
  available(){
    try{ const t="rtr.probe"; localStorage.setItem(t,"1"); localStorage.removeItem(t); return true; }
    catch(e){ return false; }
  }
};
/* Probed once. Today renders a designed state from this rather than
   firing a toast that scrolls away before it is read. */
const STORAGE_OK = Store.available();

const BLANK = () => ({
  schema:SCHEMA,
  v:1,                 // retained so an older build could still read the core
  profile:{ name:CLIENT.name, created:new Date().toISOString(), onboarded:false },
  obDraft:null,        // additive: a part-finished baseline survives a reload
  baseline:null,
  entries:{},          // "YYYY-MM-DD" -> entry
  body:{},             // "YYYY-MM-DD" -> body check   (schema 2)
  sitreps:{},          // weekStart "YYYY-MM-DD" -> sitrep
  seen:{},             // lessonId -> ISO last shown
  today:null,          // { date, lessonId }
  coach:[],            // { ts, action, note }
  prefs:{ weightUnit:"kg", waistUnit:"cm" },
  usage:{ opens:0, firstOpen:null, lastOpen:null, views:{} },
  insightLog:[],       // { d, text, tone } — which notes were actually surfaced
  reportLog:[],        // { week, ts } — when a weekly report was generated
  defer:{},            // additive: { sitrep:"YYYY-MM-DD" } — "not today, thanks"
  phase:{ key:"stabilise", name:"Stabilise", locked:true }
});

/* Migration. Returns a normalised state, or null if the payload is not
   something this build should touch. Never mutates the input. */
function migrate(p){
  if(!p || typeof p !== "object" || Array.isArray(p)) return null;
  const from = typeof p.schema === "number" ? p.schema : (p.v === 1 ? 1 : null);
  if(from === null) return null;
  if(from > SCHEMA)  return null;          // written by a newer build than this one
  const out = Object.assign(BLANK(), p);
  if(from < 2){
    out.body       = (p.body && typeof p.body === "object") ? p.body : {};
    out.prefs      = Object.assign({ weightUnit:"kg", waistUnit:"cm" }, p.prefs || {});
    out.usage      = Object.assign({ opens:0, firstOpen:null, lastOpen:null, views:{} }, p.usage || {});
    out.insightLog = Array.isArray(p.insightLog) ? p.insightLog : [];
    out.reportLog  = Array.isArray(p.reportLog)  ? p.reportLog  : [];
  }
  /* Additive fields, safe for any earlier payload. */
  out.defer   = (p.defer && typeof p.defer === "object" && !Array.isArray(p.defer)) ? p.defer : {};
  out.obDraft = (p.obDraft && typeof p.obDraft === "object") ? p.obDraft : null;
  out.profile = Object.assign({ name:"", created:new Date().toISOString(), onboarded:false }, p.profile||{});
  /* A configured Companion always knows who it belongs to, including
     records written before the name was configuration. */
  if(CLIENT.name && !out.profile.name) out.profile.name = CLIENT.name;
  out.schema = SCHEMA;
  out.v = 1;
  return out;
}

let S;
function load(){
  const raw = Store.read();
  if(!raw) return BLANK();
  try{
    const migrated = migrate(JSON.parse(raw));
    if(!migrated){ console.warn("Stored data not readable by this build; leaving it untouched."); return BLANK(); }
    return migrated;
  }catch(e){ console.warn("Store unreadable, starting fresh."); return BLANK(); }
}
function save(){
  if(!Store.write(JSON.stringify(S)))
    toast("Couldn't save — device storage is full or blocked.");
}
S = load();

/* ------------------------------------------------------------------
   2b. PILOT OBSERVABILITY
   Local only. No score, no streak, nothing shown to the client. This
   exists so the coach can tell whether the loop is actually being used.
   ------------------------------------------------------------------ */
/* Read before it is overwritten. A gap is a gap in observations —
   never a lapse, and never described as one. */
let AWAY_DAYS = 0;
function noteOpen(){
  const now = new Date().toISOString();
  if(S.usage.lastOpen){
    const prev = new Date(S.usage.lastOpen); prev.setHours(0,0,0,0);
    AWAY_DAYS = Math.max(0, Math.round((today() - prev)/DAY));
  }
  S.usage.opens = (S.usage.opens||0) + 1;
  if(!S.usage.firstOpen) S.usage.firstOpen = now;
  S.usage.lastOpen = now;
  save();
}
function noteView(tab){
  S.usage.views = S.usage.views || {};
  S.usage.views[tab] = (S.usage.views[tab]||0) + 1;
  save();
}
function logInsight(n){
  if(!n) return;
  const d = todayKey();
  if(S.insightLog.some(x => x.d===d && x.text===n.text)) return;
  S.insightLog.push({ d, text:n.text, tone:n.tone });
  if(S.insightLog.length > 400) S.insightLog = S.insightLog.slice(-400);
}
/* How many entries were written on the day they describe, vs later. */
function retroSplit(){
  let sameDay=0, later=0, unknown=0;
  entryList().forEach(e=>{
    if(!e.ts){ unknown++; return; }
    (e.ts.slice(0,10) === e.date) ? sameDay++ : later++;
  });
  return { sameDay, later, unknown };
}

/* ------------------------------------------------------------------
   3. DATES
   ------------------------------------------------------------------ */
const DAY = 86400000;
const pad2 = n => String(n).padStart(2,"0");
function key(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function fromKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function todayKey(){ return key(today()); }
function shift(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weekStart(d){                       // Monday
  const x = new Date(d); x.setHours(0,0,0,0);
  const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x;
}
const MON=["January","February","March","April","May","June","July",
           "August","September","October","November","December"];
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function longDate(d){ return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]; }
function shortDate(d){ return d.getDate()+" "+MON[d.getMonth()].slice(0,3); }
function relDate(k){
  const t=todayKey();
  if(k===t) return "Today";
  if(k===key(shift(today(),-1))) return "Yesterday";
  return longDate(fromKey(k));
}

/* ------------------------------------------------------------------
   4. VALUE MAPS
   Internal ordinals exist so rules can compare days. They are never
   shown to the client as numbers, and never summed into a score.
   ------------------------------------------------------------------ */
const SCALE = {
  meals:   { no:1, mostly:2, yes:3 },
  protein: { low:1, some:2, good:3 },
  plants:  { low:1, some:2, plenty:3 },
  water:   { behind:1, nearly:2, nailed:3 },
  gut:     { rough:1, ok:2, good:3 },
  energy:  { low:1, ok:2, good:3 }
};
const LABEL = {
  meals:   { yes:"Yes", mostly:"Mostly", no:"No" },
  protein: { low:"Low", some:"Some", good:"Good" },
  plants:  { low:"Low", some:"Some", plenty:"Plenty" },
  water:   { behind:"Behind", nearly:"Nearly", nailed:"Nailed it" },
  gut:     { good:"Good", ok:"OK", rough:"Rough" },
  energy:  { low:"Low", ok:"OK", good:"Good" }
};
const SYMPTOMS = ["Bloating","Pain","Loose","Constipation","Reflux","Other"];
const v = (e,m) => e && e[m] ? SCALE[m][e[m]] : 0;

/* ------------------------------------------------------------------
   5. ENTRY QUERIES
   ------------------------------------------------------------------ */
function entryList(){
  return Object.keys(S.entries).sort().map(k => Object.assign({date:k}, S.entries[k]));
}
function entriesBetween(a,b){          // inclusive Date range
  const A=key(a), B=key(b);
  return entryList().filter(e => e.date>=A && e.date<=B);
}
function lastN(n){                     // last n *tracked* entries, oldest first
  const all = entryList(); return all.slice(Math.max(0, all.length-n));
}
function windowDays(n){                // entries within last n calendar days
  return entriesBetween(shift(today(),-(n-1)), today());
}
const count = (arr,fn) => arr.reduce((a,e)=>a+(fn(e)?1:0),0);
const mean = (arr,m) => { const xs=arr.map(e=>v(e,m)).filter(Boolean);
  return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : 0; };

/* ------------------------------------------------------------------
   6. CURIOSITY ENGINE
   Every note carries its own basis line. If the coach can't see why a
   note appeared, the note shouldn't appear. No causal language, no
   percentages, no adherence.
   ------------------------------------------------------------------ */
function curiosityNotes(scope){
  const recent = scope || windowDays(14);
  const last7  = recent.slice(Math.max(0,recent.length-7));
  const prev7  = recent.slice(Math.max(0,recent.length-14), Math.max(0,recent.length-7));
  const out = [];
  const add = (w,tone,text,basis) => out.push({w,tone,text,basis});

  if(recent.length < 4){
    add(10,"neutral",
      "We don't have enough here yet to call anything a pattern. Keep going \u2014 a few more days and this starts to earn its place.",
      recent.length+" tracked "+(recent.length===1?"day":"days")+" so far.");
    return out;
  }

  /* --- things becoming established --- */
  const water3 = count(last7,e=>v(e,"water")===3);
  if(water3>=5) add(70,"living","Hydration is becoming one of your more consistent habits.",
    water3+" of your last "+last7.length+" tracked days.");

  const prot3 = count(last7,e=>v(e,"protein")===3);
  if(prot3>=5) add(72,"living","Protein is becoming reliable rather than occasional.",
    prot3+" strong protein days out of "+last7.length+".");

  const meals3 = count(last7,e=>v(e,"meals")===3);
  if(meals3>=5) add(74,"living","Your meal rhythm looks more predictable than it did.",
    meals3+" of "+last7.length+" days broadly to plan.");

  const plants3 = count(last7,e=>v(e,"plants")===3);
  if(plants3>=4) add(64,"living","Plant intake has been sitting high fairly often.",
    plants3+" days at Plenty out of "+last7.length+".");

  /* --- things worth watching --- */
  const rough7 = count(last7,e=>v(e,"gut")===1);
  if(rough7>=3) add(88,"watch","Your gut has felt rough more than once recently. Worth talking about at our next check-in.",
    rough7+" rough days in your last "+last7.length+" tracked days.");

  const roughPrev = count(prev7,e=>v(e,"gut")===1);
  if(prev7.length>=4 && roughPrev>=3 && rough7<roughPrev)
    add(80,"living","Rough gut days appear less frequent than the week before. Worth watching.",
      roughPrev+" the previous week, "+rough7+" this one.");

  const water1 = count(last7,e=>v(e,"water")===1);
  if(water1>=4) add(66,"watch","Hydration has been landing behind more often than not.",
    water1+" of "+last7.length+" days marked Behind.");

  const plants1 = count(last7,e=>v(e,"plants")===1);
  if(plants1>=4) add(62,"watch","Fruit and veg have been on the low side most days this week.",
    plants1+" of "+last7.length+" days marked Low.");

  /* --- co-occurrence, stated as co-occurrence and nothing more --- */
  const lowE = recent.filter(e=>v(e,"energy")===1);
  if(lowE.length>=3){
    const withDrift = count(lowE,e=>v(e,"meals")<=2);
    if(withDrift/lowE.length >= 0.6)
      add(86,"watch","Low energy seems to show up more often on days when your meal rhythm slipped. Worth watching — it may not be the cause.",
        withDrift+" of your "+lowE.length+" low-energy days were also days meals drifted.");
  }
  const roughAll = recent.filter(e=>v(e,"gut")===1);
  if(roughAll.length>=3){
    const withLowPlants = count(roughAll,e=>v(e,"plants")<=1);
    if(withLowPlants/roughAll.length >= 0.6)
      add(76,"watch","Rough gut days have often been low-plant days too. A possible pattern, not a conclusion.",
        withLowPlants+" of "+roughAll.length+" rough days were also Low on plants.");
  }

  /* --- trend --- */
  if(prev7.length>=4 && last7.length>=4){
    const dE = mean(last7,"energy") - mean(prev7,"energy");
    if(dE >= 0.5) add(68,"living","Energy has generally been reported higher than the week before.",
      "Compared across your last two tracked weeks.");
  }

  /* --- engagement --- */
  const notes = count(recent,e=>e.note && e.note.trim());
  if(notes>=3) add(50,"neutral","You're recording observations, not just ticks. That's the part that makes a review useful.",
    notes+" written notes in this window.");
  if(recent.length>=10) add(48,"neutral","You're building a genuinely useful picture of what your nutrition actually looks like.",
    recent.length+" tracked days in the last fortnight.");

  out.sort((a,b)=>b.w-a.w);
  return out;
}
function topNotes(n,scope){
  /* One of each tone before doubling up on any of them. A rough
     fortnight is still allowed to be reported as rough — but three
     consecutive worries would read as a verdict, and it isn't one. */
  const all = curiosityNotes(scope), picked = [];
  ["watch","living","neutral"].forEach(t=>{
    if(picked.length>=n) return;
    const f = all.find(x=>x.tone===t && !picked.includes(x));
    if(f) picked.push(f);
  });
  for(const x of all){ if(picked.length>=n) break; if(!picked.includes(x)) picked.push(x); }
  return picked.slice(0,n);
}

/* ------------------------------------------------------------------
   7. ACCUMULATION
   Totals that only ever go up. A missed day adds nothing and removes
   nothing — which is the whole point.
   ------------------------------------------------------------------ */
function accumulations(){
  const all = entryList();
  return [
    { n: all.length,                                   l:"check-ins completed" },
    { n: count(all,e=>v(e,"meals")>=2),                l:"days meals were broadly on plan" },
    { n: count(all,e=>v(e,"protein")===3),             l:"strong protein days" },
    { n: count(all,e=>v(e,"plants")===3),              l:"strong plant days" },
    { n: count(all,e=>v(e,"water")===3),               l:"days hydration was achieved" },
    { n: count(all,e=>v(e,"gut")===3),                 l:"days your gut felt good" },
    { n: count(all,e=>e.note&&e.note.trim()),          l:"observations written down" },
    { n: Object.keys(S.sitreps).length,                l:"weekly check-ins completed" }
  ];
}

/* ------------------------------------------------------------------
   8. READINESS
   Five domains, three states, no number. This informs the coaching
   conversation. It does not make the decision.
   ------------------------------------------------------------------ */
function band(x,hi,lo){ return x>=hi ? "est" : x>=lo ? "dev" : "att"; }
const STATE = { est:"Established", dev:"Developing", att:"Needs attention", new:"Not enough yet" };

function readiness(){
  const w = windowDays(14);
  const enough = w.length>=6;
  const r = [];

  /* Early on there is simply nothing to read. Saying "Needs attention"
     to a client on day two would be a judgement about them rather than
     a statement about the data. */
  if(entryList().length < 4){
    return [
      ["Rhythm","Are meals becoming predictable?"],
      ["Fundamentals","Protein, plants and hydration."],
      ["Awareness","Is he noticing useful things?"],
      ["Engagement","Is there enough to coach from?"],
      ["Ownership","Is he making more of his own calls?"]
    ].map(([k,q])=>({k,q,s:"new",why:"Too few tracked days to read this fairly yet."}));
  }

  r.push({ k:"Rhythm", q:"Are meals becoming predictable?",
    s: enough ? band(mean(w,"meals"),2.6,2.1) : "new",
    why: enough ? "Meal rhythm across "+w.length+" tracked days in the last fortnight."
                : "Not enough tracked days yet to read this fairly." });

  const fund = enough ? (mean(w,"protein")+mean(w,"plants")+mean(w,"water"))/3 : 0;
  r.push({ k:"Fundamentals", q:"Protein, plants and hydration.",
    s: enough ? band(fund,2.55,2.05) : "new",
    why: enough ? "Protein, plants and water read together across the fortnight."
                : "Needs more tracked days." });

  const obs = count(w,e=>e.note&&e.note.trim()) + Object.keys(S.sitreps).length
            + count(w,e=>e.symptoms&&e.symptoms.length);
  r.push({ k:"Awareness", q:"Is he noticing useful things?",
    s: band(obs,5,2),
    why: obs+" written observations, symptom details and weekly check-ins recorded." });

  r.push({ k:"Engagement", q:"Is there enough to coach from?",
    s: band(w.length,10,6),
    why: w.length+" of the last 14 days tracked." });

  const conf = S.baseline ? (S.baseline.answers.q10||0) : 0;
  const sit  = Object.keys(S.sitreps).length;
  const own  = (conf>=3?1.5:conf>=2?1:0) + Math.min(sit,3)*0.7 + (entryList().length>=14?1:0);
  r.push({ k:"Ownership", q:"Is he making more of his own calls?",
    s: band(own,3,1.5),
    why: "Approximated from the baseline confidence answer, weekly check-ins and time on plan. Confirm this in conversation." });

  return r;
}
function readinessFlags(){
  const w = windowDays(14), f = [];
  const rough = count(w,e=>v(e,"gut")===1);
  if(rough>=4) f.push("Gut symptoms have been reported "+rough+" times in the last fortnight. Worth reviewing before progression, and worth considering whether medical assessment is appropriate.");
  const sym = {};
  w.forEach(e => (e.symptoms||[]).forEach(s => sym[s]=(sym[s]||0)+1));
  Object.keys(sym).forEach(s=>{ if(sym[s]>=4) f.push(s+" has been recorded "+sym[s]+" times in the last fortnight."); });
  if(w.length<6) f.push("Tracking is currently thin. There may not be enough information for a fair stage review.");
  const lowE = count(w,e=>v(e,"energy")===1);
  if(lowE>=5) f.push("Low energy reported on "+lowE+" of the last "+w.length+" tracked days.");
  return f;
}
function reviewSignal(){
  const w = windowDays(14);
  if(w.length<8) return null;
  const est = readiness().filter(r=>r.s==="est").length;
  if(est>=3) return "There may now be enough information for a stage review.";
  return null;
}

/* ------------------------------------------------------------------
   9. WEEKLY REPORT
   Rule-based, assembled from what is actually there. No AI, and no
   filler when the week is thin — it says so instead.
   ------------------------------------------------------------------ */
function weekReport(ws){
  const start = ws, end = shift(ws,6);
  const es = entriesBetween(start,end);
  const sr = S.sitreps[key(ws)] || null;
  const rep = { start, end, n:es.length, well:[], hard:[], body:[], notes:[], view:sr, focus:null };

  if(!es.length){
    rep.well.push("No days were tracked this week. That's information too — the week itself may have been the obstacle.");
    return rep;
  }

  const push=(a,c,t)=>{ if(c) a.push(t); };
  push(rep.well, count(es,e=>v(e,"meals")>=2)>=Math.ceil(es.length*0.7),
    "Meals stayed broadly to your intended rhythm on "+count(es,e=>v(e,"meals")>=2)+" of "+es.length+" tracked days.");
  push(rep.well, count(es,e=>v(e,"protein")===3)>=3,
    "Protein landed well on "+count(es,e=>v(e,"protein")===3)+" days.");
  push(rep.well, count(es,e=>v(e,"water")===3)>=3,
    "Hydration was achieved on "+count(es,e=>v(e,"water")===3)+" days.");
  push(rep.well, count(es,e=>v(e,"plants")===3)>=3,
    "Fruit and veg were strong on "+count(es,e=>v(e,"plants")===3)+" days.");
  push(rep.well, es.length>=5, "You checked in on "+es.length+" days this week.");
  if(sr && sr.bestText && sr.bestText.trim()) rep.well.push("In your own words: "+sr.bestText.trim());
  if(!rep.well.length) rep.well.push("You kept recording, which is what makes the next conversation useful.");

  push(rep.hard, count(es,e=>v(e,"water")<=1)>=3,
    "Hydration finished behind on "+count(es,e=>v(e,"water")<=1)+" days.");
  push(rep.hard, count(es,e=>v(e,"protein")<=1)>=3,
    "Protein was low on "+count(es,e=>v(e,"protein")<=1)+" days.");
  push(rep.hard, count(es,e=>v(e,"plants")<=1)>=3,
    "Plants were low on "+count(es,e=>v(e,"plants")<=1)+" days.");
  push(rep.hard, count(es,e=>v(e,"meals")===1)>=2,
    "Meal rhythm came apart on "+count(es,e=>v(e,"meals")===1)+" days.");
  if(sr && sr.hardText && sr.hardText.trim()) rep.hard.push("You said the hardest part was: "+sr.hardText.trim());
  if(!rep.hard.length) rep.hard.push("Nothing stood out as a repeated obstacle this week.");

  const g = {good:count(es,e=>v(e,"gut")===3), ok:count(es,e=>v(e,"gut")===2), rough:count(es,e=>v(e,"gut")===1)};
  rep.body.push("Gut: "+g.good+" good, "+g.ok+" OK, "+g.rough+" rough.");
  const en = {good:count(es,e=>v(e,"energy")===3), ok:count(es,e=>v(e,"energy")===2), low:count(es,e=>v(e,"energy")===1)};
  rep.body.push("Energy: "+en.good+" good, "+en.ok+" OK, "+en.low+" low.");
  const sym = {}; es.forEach(e=>(e.symptoms||[]).forEach(s=>sym[s]=(sym[s]||0)+1));
  const symList = Object.keys(sym).sort((a,b)=>sym[b]-sym[a]);
  if(symList.length) rep.body.push("Recorded alongside rough days: "+symList.map(s=>s.toLowerCase()+" ×"+sym[s]).join(", ")+".");

  rep.notes = topNotes(3, es);

  /* one focus, framed as a proposal */
  const cands = [
    {m:"water",   t:"Hydration",     f:"Make water automatic — attach it to something you already do daily."},
    {m:"protein", t:"Protein",       f:"Name the protein in every main meal before you eat it."},
    {m:"plants",  t:"Plants",        f:"Add one extra vegetable to your main meal, every day."},
    {m:"meals",   t:"Meal rhythm",   f:"Decide the timing of your next two meals before you're hungry."}
  ].map(c => Object.assign(c,{avg:mean(es,c.m)})).filter(c=>c.avg>0).sort((a,b)=>a.avg-b.avg);
  if(cands.length) rep.focus = { title:cands[0].t, text:cands[0].f };
  if(sr && sr.improve){
    const map = {meals:"Meal rhythm",protein:"Protein",plants:"Plants",water:"Hydration",snacks:"Snacking",gut:"Gut comfort"};
    if(map[sr.improve]) rep.focus = { title:map[sr.improve],
      text:"You chose this yourself, which usually makes it the one worth taking." };
  }
  return rep;
}
function weeksWithData(){
  const set = {};
  entryList().forEach(e => set[key(weekStart(fromKey(e.date)))]=1);
  Object.keys(S.sitreps).forEach(k => set[k]=1);
  return Object.keys(set).sort().reverse().map(fromKey);
}

/* ------------------------------------------------------------------
   10. LESSON ROTATION
   Least-recently-seen wins. Nothing is ever locked or lost.
   ------------------------------------------------------------------ */
function lessonForToday(){
  const t = todayKey();
  if(S.today && S.today.date===t){
    const l = LESSONS.find(x=>x.id===S.today.lessonId);
    if(l) return l;
  }
  const unseen = LESSONS.filter(l=>!S.seen[l.id]);
  const pick = unseen.length
    ? unseen[Math.floor(Math.random()*unseen.length)]
    : LESSONS.slice().sort((a,b)=>(S.seen[a.id]||"").localeCompare(S.seen[b.id]||""))[0];
  S.today = { date:t, lessonId:pick.id };
  S.seen[pick.id] = new Date().toISOString();
  save();
  return pick;
}

/* ------------------------------------------------------------------
   24. BODY CHECK  ·  capture only
   Weight and waist, both optional, weekly by intent. Values are stored
   canonically (kg / cm) alongside the unit the client actually typed,
   so nothing drifts through repeated conversion and it can always be
   shown back in their own units.

   There is deliberately no interpretation here. No deltas, no arrows,
   no pace, no celebration, no concern. A single reading means very
   little and this pass is not the place to pretend otherwise.
   ------------------------------------------------------------------ */
const KG_PER_ST = 6.35029318, KG_PER_LB = 0.45359237, CM_PER_IN = 2.54;

function toKg(unit, a, b){
  const x = Number(a)||0, y = Number(b)||0;
  if(unit==="kg") return x>0 ? x : null;
  if(unit==="lb") return x>0 ? x*KG_PER_LB : null;
  if(unit==="st") return (x>0||y>0) ? x*KG_PER_ST + y*KG_PER_LB : null;
  return null;
}
function toCm(unit, a){
  const x = Number(a)||0;
  if(x<=0) return null;
  return unit==="in" ? x*CM_PER_IN : x;
}
function fmtWeight(kg, unit){
  if(kg==null) return "—";
  if(unit==="lb") return (kg/KG_PER_LB).toFixed(1)+" lb";
  if(unit==="st"){
    const total = kg/KG_PER_LB, st = Math.floor(total/14), lb = total - st*14;
    return st+" st "+lb.toFixed(1)+" lb";
  }
  return kg.toFixed(1)+" kg";
}
function fmtWaist(cm, unit){
  if(cm==null) return "—";
  return unit==="in" ? (cm/CM_PER_IN).toFixed(1)+" in" : cm.toFixed(1)+" cm";
}
function bodyList(){
  return Object.keys(S.body).sort().reverse().map(k => Object.assign({date:k}, S.body[k]));
}
function saveBody(dateKey, rec){
  const existing = S.body[dateKey];
  S.body[dateKey] = Object.assign({}, rec, {
    ts: existing && existing.ts ? existing.ts : new Date().toISOString(),
    updated: new Date().toISOString()
  });
  save();
}
function deleteBody(dateKey){ delete S.body[dateKey]; save(); }
/* Has a measurement been recorded in the current week? Used only to
   decide whether to offer the prompt — never to chase or nag. */
function bodyThisWeek(){
  const ws = key(weekStart(today())), we = key(shift(weekStart(today()),6));
  return Object.keys(S.body).some(k => k>=ws && k<=we);
}

/* ------------------------------------------------------------------
   25. BACKUP · EXPORT / IMPORT
   The export is the client's copy of their own record. The import is
   deliberately suspicious: it validates a candidate completely before
   anything live is touched, and never replaces silently.
   ------------------------------------------------------------------ */
function exportPayload(){
  return {
    meta:{
      product:"RTR Nutrition Companion",
      phase:"Phase 1 · Stabilise",
      client:S.profile.name || "Client",
      schema:SCHEMA,
      app:APP_VERSION,
      exported:new Date().toISOString(),
      counts:{
        checkIns:Object.keys(S.entries).length,
        bodyChecks:Object.keys(S.body).length,
        weeklyCheckIns:Object.keys(S.sitreps).length
      }
    },
    data:S
  };
}
function exportFilename(){
  const who = (S.profile.name||"client").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "client";
  return "RTR-Companion_"+who+"_"+todayKey()+".json";
}

/* Returns { ok, error, state, summary }. Pure — touches nothing. */
function validateBackup(raw){
  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ return { ok:false, error:"That file isn't readable as JSON. It may be damaged or not a Companion backup." }; }

  if(!parsed || typeof parsed !== "object" || Array.isArray(parsed))
    return { ok:false, error:"That file doesn't contain a Companion backup." };

  const meta = parsed.meta && typeof parsed.meta === "object" ? parsed.meta : null;
  const body = (parsed.data && typeof parsed.data === "object") ? parsed.data : parsed;

  if(meta && typeof meta.schema === "number" && meta.schema > SCHEMA)
    return { ok:false, error:"That backup was written by a newer version of the Companion. Update the app before restoring it." };

  if(!body.profile || typeof body.profile !== "object" ||
     !body.entries || typeof body.entries !== "object" || Array.isArray(body.entries))
    return { ok:false, error:"That file is missing the parts a Companion backup must contain." };

  const migrated = migrate(body);
  if(!migrated)
    return { ok:false, error:"That backup's format isn't one this version can read." };

  /* Shape-check the records themselves rather than trusting the header. */
  const dateRe = /^\d{4}-\d{2}-\d{2}$/;
  let badDates = 0, kept = 0;
  const clean = {};
  Object.keys(migrated.entries).forEach(k=>{
    const e = migrated.entries[k];
    if(!dateRe.test(k) || !e || typeof e !== "object"){ badDates++; return; }
    const known = ["meals","protein","plants","water","gut","energy"]
      .filter(m => e[m] && SCALE[m] && SCALE[m][e[m]]);
    if(!known.length){ badDates++; return; }
    clean[k] = e; kept++;
  });
  if(!kept && Object.keys(migrated.entries).length)
    return { ok:false, error:"None of the check-ins in that file could be read. Nothing has been changed." };
  migrated.entries = clean;

  const cleanBody = {};
  Object.keys(migrated.body||{}).forEach(k=>{
    const r = migrated.body[k];
    if(dateRe.test(k) && r && typeof r === "object" &&
       (typeof r.weightKg === "number" || typeof r.waistCm === "number")) cleanBody[k] = r;
  });
  migrated.body = cleanBody;

  return {
    ok:true, state:migrated, discarded:badDates,
    summary:{
      client: (meta && meta.client) || migrated.profile.name || "Unnamed",
      exported: meta && meta.exported ? meta.exported : null,
      schema: (meta && meta.schema) || migrated.schema,
      checkIns: kept,
      bodyChecks: Object.keys(cleanBody).length,
      weeklyCheckIns: Object.keys(migrated.sitreps||{}).length
    }
  };
}

/* ------------------------------------------------------------------
   11. UI PLUMBING
   ------------------------------------------------------------------ */
const $  = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

let TAB = "today";
let DRAFT = null;          // in-progress tracker entry

function toast(msg){
  const r = $("#toastroot"); r.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ r.innerHTML=""; }, 2600);
}
/* Screen changes and saves are visible; they should also be audible to
   anyone using a screen reader, without hijacking focus. */
function announce(msg){
  const r = $("#liveroot"); if(!r) return;
  r.textContent = ""; setTimeout(()=>{ r.textContent = msg; }, 60);
}
let SHEET_OPENER = null;
let LAST_TRIGGER = null;   // the button that was actually pressed — a touch tap may not focus it
const FOCUSABLE = 'button:not([disabled]),input:not([disabled]),textarea:not([disabled]),'+
                  'select:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
/* ------------------------------------------------------------------
   Back-gesture routing.
   P2.2b: history.pushState was silently failing on the device. The
   Companion is opened from a content:// URI, where pushState throws a
   SecurityError, so the guard entry was never created and the back
   gesture left the app. Hash changes are same-document navigations and
   work on any origin, so routing runs on the hash instead.

   The hash carries the tab, with "!panel" appended while a sheet is
   open. Back therefore closes a sheet, then walks back through the
   tabs, and only leaves the app from the first screen.
   ------------------------------------------------------------------ */
function currentHash(){ return (location.hash || "").replace(/^#/, ""); }
function setHash(h, replace){
  if(currentHash() === h) return;
  try{
    if(replace && history.replaceState){ history.replaceState(null, "", "#"+h); return; }
  }catch(e){ /* fall through to assignment */ }
  location.hash = h;
}
function sheetOpen(){ return $("#sheetwrap").classList.contains("open"); }

let SHEET_KIND = null;     // so an action can redraw the panel it happened in
function openSheet(html, kind){
  SHEET_KIND = kind || null;
  const w = $("#sheetwrap");
  const wasOpen = w.classList.contains("open");
  if(!wasOpen){
    const cand = (LAST_TRIGGER && document.contains(LAST_TRIGGER)) ? LAST_TRIGGER : document.activeElement;
    SHEET_OPENER = (cand && cand.tagName === "BUTTON") ? cand : null;
    setHash(TAB + "!panel");
  }
  $("#sheetbody").innerHTML = html;
  w.hidden=false; w.classList.add("open");
  document.body.style.overflow="hidden";
  const sh = w.querySelector(".sheet");
  sh.setAttribute("tabindex","-1"); sh.scrollTop = 0; sh.focus({preventScroll:true});
}
function closeSheet(fromHistory){
  const w = $("#sheetwrap");
  if(!w.classList.contains("open")) return;
  w.classList.remove("open"); w.hidden=true;
  $("#sheetbody").innerHTML=""; document.body.style.overflow="";
  if(SHEET_OPENER && document.contains(SHEET_OPENER)){
    try{ SHEET_OPENER.focus({preventScroll:true}); }catch(e){}
  }
  SHEET_OPENER = null; SHEET_KIND = null;
  /* A close by button should consume the history entry the open
     created, so the back gesture doesn't have to be pressed twice. */
  if(!fromHistory && /!panel$/.test(currentHash())){
    try{ history.back(); }catch(e){ setHash(TAB, true); }
  }
}
function onRoute(){
  const h = currentHash();
  const wantsPanel = /!panel$/.test(h);
  const wantsTab   = h.replace("!panel", "") || "today";
  if(!wantsPanel && sheetOpen()) closeSheet(true);
  if(!wantsPanel && TAB_NAME[wantsTab] && wantsTab !== TAB) go(wantsTab, true);
}
window.addEventListener("hashchange", onRoute);
window.addEventListener("popstate", onRoute);
/* Keep Tab inside an open sheet. Escape still closes it. */
function trapFocus(e){
  const w = $("#sheetwrap");
  if(e.key!=="Tab" || !w.classList.contains("open")) return;
  const items = Array.from(w.querySelectorAll(FOCUSABLE)).filter(el=>el.offsetParent!==null);
  if(!items.length) return;
  const first = items[0], last = items[items.length-1];
  if(e.shiftKey && (document.activeElement===first || document.activeElement===w.querySelector(".sheet"))){
    e.preventDefault(); last.focus();
  } else if(!e.shiftKey && document.activeElement===last){
    e.preventDefault(); first.focus();
  }
}
const TAB_NAME = { today:"Today", track:"Check-in", plan:"My plan", learn:"Learn", insights:"Insights" };
function go(tab, fromHistory){
  TAB = tab;
  document.querySelectorAll(".tab").forEach(b=>{
    const on = b.dataset.tab===tab;
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  /* Back should return to the previous screen, not leave the app. */
  if(!fromHistory) setHash(tab, tab==="today" && !currentHash());
  noteView(tab);
  render();
  window.scrollTo({top:0,behavior:"instant"});
  announce(TAB_NAME[tab]||tab);
}
function render(){
  const v = $("#view");
  v.innerHTML = ({today:viewToday, track:viewTrack, plan:viewPlan,
                  learn:viewLearn, insights:viewInsights})[TAB]();
}

/* segmented control markup ------------------------------------------------ */
function segment(metric, current, extraClass){
  const keys = Object.keys(LABEL[metric]);
  const lab = metric[0].toUpperCase()+metric.slice(1);
  return '<div class="seg'+(extraClass||"")+'" role="group" aria-label="'+lab+'">'+
    keys.map(k=>{
      const lv = SCALE[metric][k];
      return '<button type="button" class="opt lv'+lv+'" data-act="opt" data-m="'+metric+'" data-v="'+k+'" '+
        'aria-pressed="'+(current===k)+'">'+LABEL[metric][k]+'</button>';
    }).join("")+'</div>';
}
