   ------------------------------------------------------------------ */
function greeting(){
  const h = new Date().getHours();
  return h<12 ? "Morning" : h<18 ? "Afternoon" : "Evening";
}
function clientName(){ return S.profile.name || ""; }

/* His name where it means something: the first days, a return after a
   gap, and the start of a week. Everywhere else the Companion simply
   talks to him. Templated personalisation reads as a mail merge. */
function nameMoment(){
  if(!clientName()) return false;
  if(!entryList().length) return true;
  if(AWAY_DAYS>=3) return true;
  if(key(weekStart(today()))===todayKey()) return true;
  return false;
}

/* ------------------------------------------------------------------
   13a. THE SHAPE OF TODAY
   What is genuinely useful today, and nothing beyond that. The rule
   this file lives by: never invent a task in order to keep the day
   open, and never hold the day open once there is nothing left worth
   asking for.
   ------------------------------------------------------------------ */
function sitrepReady(){
  if(S.sitreps[key(weekStart(today()))]) return false;
  return entriesBetween(weekStart(today()), today()).length >= 4 || new Date().getDay()===0;
}
function sitrepDeferred(){ return (S.defer||{}).sitrep === todayKey(); }
/* The weekly check-in only holds the day open at the end of the week,
   and only until he says not today. A card that blocks every evening
   from Thursday onwards would be a nag with a calendar. */
function sitrepBlocking(){
  const d = new Date().getDay();
  return sitrepReady() && !sitrepDeferred() && (d===0 || d===6);
}
function bodyOffered(){
  const d = new Date().getDay();
  return !bodyThisWeek() && entryList().length>=3 && (d===0 || d===6);
}
function dayShape(){
  const tracked = !!S.entries[todayKey()];
  const blocking = sitrepBlocking();
  return { tracked, ready:sitrepReady(), blocking, body:bodyOffered(),
           resolved: tracked && !blocking };
}

let JUST_SAVED = false;      // set by a save, consumed by the next render

/* The resolved hero absorbs the greeting, so the top of the screen
   changes material entirely once the check-in is in. The routes are
   not here — they sit at the foot of the page, out of the way. */
function donePanel(flash){
  return '<div class="done mark'+(flash?" flash":"")+'" style="margin-top:20px">'+
    '<p class="d">'+longDate(today())+'</p>'+
    '<div class="tick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></div>'+
    '<h2>'+(flash ? "That\u2019s captured." : "You\u2019re done for today.")+'</h2>'+
    '<p class="say">We\u2019ve got what we need. Go and live your life.</p>'+
  '</div>';
}

/* Everything optional, gathered at the foot where it belongs. */
function tailRoutes(tracked){
  return '<nav class="tailroutes" aria-label="Elsewhere in your Companion">'+
    '<p class="rlabel">More, if you want it</p>'+
    '<div class="rgrid">'+
      '<button type="button" class="btn quiet sm" data-act="tab" data-tab="plan">Explore my plan</button>'+
      '<button type="button" class="btn quiet sm" data-act="tab" data-tab="learn">Learn something</button>'+
      '<button type="button" class="btn quiet sm" data-act="tab" data-tab="insights">Review insights</button>'+
      (tracked ? '<button type="button" class="btn quiet sm" data-act="tab" data-tab="track">Change today\u2019s check-in</button>' : "")+
    '</div>'+
  '</nav>';
}

function viewToday(){
  const sh    = dayShape();
  const l     = lessonForToday();
  const notes = entryList().length ? topNotes(1) : [];
  notes.forEach(logInsight); save();
  const flash = JUST_SAVED; JUST_SAVED = false;
  const first = !entryList().length;
  const returning = AWAY_DAYS>=3 && !first;

  /* If the welcome-back note is going to say his name, the greeting
     directly above it does not. Twice in two lines is a mail merge. */
  const head =
    '<section class="greet">'+
      '<p class="d">'+longDate(today())+'</p>'+
      '<h1 class="big">'+greeting()+((nameMoment() && !returning) ? " "+esc(clientName()) : "")+'.</h1>'+
    '</section>';

  /* Storage refusing to work is the one thing worth interrupting for,
     because everything below it would otherwise be a false promise. */
  const storageWarning = STORAGE_OK ? "" :
    '<div class="notice terra" style="margin-top:14px">'+
      '<p class="t">This browser isn\u2019t letting the Companion save</p>'+
      '<p class="s">You can look around, but nothing you record will still be here tomorrow. '+
      'Private browsing is the usual cause \u2014 opening the Companion in a normal tab should sort it.</p>'+
    '</div>';

  const welcomeBack = returning ?
    '<div class="notice glass mark" style="margin-top:14px">'+
      '<p class="t">Good to see you'+(clientName()?", "+esc(clientName()):"")+'.</p>'+
      '<p class="s">There\u2019s nothing to catch up on. Today is simply a fresh observation.</p>'+
    '</div>' : "";

  const read = (mt) =>
    '<div class="read" style="margin-top:'+mt+'px">'+
      '<p class="tag">Today\u2019s 30 seconds</p>'+
      '<h3>'+esc(l.title)+'</h3>'+
      '<p class="body">'+esc(l.body)+'</p>'+
    '</div>'+
    '<div class="try">'+
      '<p class="tag">Something to try</p>'+
      '<p>'+esc(l.action)+'</p>'+
    '</div>';

  const worthNoticing = notes.length
    ? '<section class="sect"><p class="eyebrow"><span>From your check-ins</span><span class="sep"></span></p>'+
        notes.map(noteCard).join("")+
      '</section>' : "";

  const sitrepCard = (primary) =>
    '<section class="sect"><div class="card spine brass">'+
      '<h3 class="ch">Your weekly check-in is ready</h3>'+
      '<p class="small">Five questions, about a minute. It\u2019s the part the daily numbers can\u2019t tell us \u2014 '+
      'and it\u2019s what makes your weekly summary worth reading.</p>'+
      '<button type="button" class="btn '+(primary?"primary":"quiet")+'" style="margin-top:12px'+
        (primary?"":";width:auto")+'" data-act="sitrep">Start the weekly check-in</button>'+
      (primary ? '<button type="button" class="btn quiet" style="margin-top:9px" data-act="sit-later">Not today</button>' : "")+
    '</div></section>';

  const bodyCard =
    '<section class="sect"><div class="card spine">'+
      '<h3 class="ch">Weekly body check</h3>'+
      '<p class="small">Weight and waist, if you want them recorded. Both optional. '+
      'It\u2019s the trend that tells us anything \u2014 one reading on its own means very little.</p>'+
      '<button type="button" class="btn quiet" style="margin-top:11px;width:auto" data-act="body">Add a measurement</button>'+
    '</div></section>';

  /* Only once there is enough of it to feel like something. Four zeros
     on day one is a worse welcome than nothing at all. */
  const addingUp = entryList().length>=4
    ? '<section class="sect">'+
        '<p class="eyebrow"><span>What\u2019s adding up</span><span class="sep"></span></p>'+
        '<div class="accum">'+ accumulations().slice(0,2).map(a=>
          '<div class="acc"><div class="n">'+a.n+'</div><div class="l">'+a.l+'</div></div>').join("")+
        '</div>'+
      '</section>' : "";   // "Review insights" lives in the foot routes now

  /* ---- the resolved day ----
     Hero, then the two things worth having: what to read and what to
     try, then anything the Companion has noticed. Optional routes are
     pushed to the foot. */
  if(sh.resolved){
    return storageWarning + welcomeBack + donePanel(flash) +
      read(16) +
      worthNoticing +
      (sh.ready && !flash ? sitrepCard(false) : "") +
      (sh.body ? bodyCard : "") +
      addingUp +
      tailRoutes(true);
  }

  /* ---- a day with something useful left in it ---- */
  const action = sh.tracked
    ? '<div class="donebar" style="margin-top:18px">'+
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>'+
        '<span><span class="t">Today\u2019s check-in is in</span><br>'+
        '<span class="s">One thing left below, then you\u2019re done.</span></span>'+
      '</div>'
    : '<div style="margin-top:18px">'+
        '<button type="button" class="btn primary" data-act="tab" data-tab="track">'+
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>Start today\u2019s check-in</button>'+
        '<p class="small" style="margin-top:9px;text-align:center">About half a minute. Nothing is scored.</p>'+
      '</div>';

  const orientation = (first && !sh.tracked)
    ? '<div class="card oat" style="margin-top:16px">'+
        '<h3 class="ch">How a day works here</h3>'+
        '<p class="small">A short read, one thing to try, and a check-in that takes about half a minute. '+
        'That\u2019s the whole day. Nothing is due, nothing is scored, and a day you miss is simply a day '+
        'we have no notes on.</p>'+
      '</div>' : "";

  return head + storageWarning + welcomeBack + read(14) + action + orientation +
    (sh.blocking ? sitrepCard(true) : "") +
    worthNoticing +
    (!sh.blocking && sh.ready ? sitrepCard(false) : "") +
    (sh.body ? bodyCard : "") +
    addingUp +
    tailRoutes(sh.tracked);
}

const NOTE_TAG = { living:"Worth noticing", watch:"Something to keep an eye on", neutral:"Worth noticing" };
function noteCard(n){
  const tone = n.tone==="living" ? "living" : n.tone==="watch" ? "watch" : "";
  return '<div class="note-card '+tone+'">'+
    '<p class="tag">'+(NOTE_TAG[n.tone]||"Worth noticing")+'</p>'+
    '<p class="txt">'+esc(n.text)+'</p>'+
    '<p class="basis">'+esc(n.basis)+'</p></div>';
}

function viewTrack(){
  const dk = DRAFT ? DRAFT.date : todayKey();
  if(!DRAFT) DRAFT = Object.assign({date:dk, symptoms:[], note:""}, S.entries[dk]||{});
  const existing = !!S.entries[dk];

function trendStrip(metric,label){
  const days=[]; for(let i=13;i>=0;i--) days.push(key(shift(today(),-i)));
  const bars = days.map(d=>{
    const e=S.entries[d]; const lv = e ? v(e,metric) : 0;
    const h = lv===0?18:lv===1?36:lv===2?70:100;
    return '<i class="g'+lv+'" style="height:'+h+'%"></i>';
  }).join("");
  return '<div class="card flat" style="margin-top:10px">'+
    '<h3 class="ch">'+label+'</h3>'+
    '<div class="trend" role="img" aria-label="'+label+' over the last 14 days">'+bars+'</div>'+
    '<div class="tlabels"><span>'+shortDate(shift(today(),-13))+'</span><span>Today</span></div>'+
    '<p class="small" style="margin-top:8px">Faded bars are days with no check-in \u2014 gaps in the picture, nothing more.</p>'+
  '</div>';
}

function doExport(){
  try{
    const blob = new Blob([JSON.stringify(exportPayload(),null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = exportFilename();
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 0);
    S.usage.lastExport = new Date().toISOString(); save();
    toast("Backup saved to your downloads.");
    announce("Backup saved to your downloads.");
    return true;
  }catch(e){
    toast("Couldn't create the backup file on this device.");
    return false;
  }
}

/* demo data ---------------------------------------------------------------
   A deliberately imperfect three weeks: hydration improving, protein
   settling, a rough gut patch in week one that eases, low energy
   clustering on days the rhythm slipped, and four missed days. */
function loadDemo(){
  if(entryList().length || Object.keys(S.sitreps).length || Object.keys(S.body).length){
    closeSheet(); toast("Sample data is blocked — this Companion holds real records."); return;
  }
  const pick=(a)=>a[Math.floor(Math.random()*a.length)];
  const N=21; S.entries={}; S.sitreps={};
  for(let i=N-1;i>=0;i--){
    const d = shift(today(),-i), k = key(d), p = (N-1-i)/(N-1);
    if([17,12,6,2].includes(i)) continue;                       // missed days
    const meals   = pick(p<.35?["no","mostly","mostly"]:p<.7?["mostly","mostly","yes"]:["mostly","yes","yes"]);
    const protein = pick(p<.3?["low","some","some"]:p<.65?["some","some","good"]:["some","good","good"]);
    const plants  = pick(p<.4?["low","some"]:p<.75?["some","some","plenty"]:["some","plenty"]);
    const water   = pick(p<.3?["behind","behind","nearly"]:p<.6?["nearly","nearly","nailed"]:["nearly","nailed","nailed"]);
    let gut = p<.35 ? pick(["rough","rough","ok"]) : p<.7 ? pick(["ok","ok","good","rough"]) : pick(["ok","good","good"]);
    if(plants==="low" && Math.random()<.5) gut = pick(["rough","ok"]);
    let energy = meals==="no" ? pick(["low","low","ok"]) : meals==="mostly" ? pick(["ok","ok","low","good"]) : pick(["ok","good","good"]);
    const e = { meals, protein, plants, water, gut, energy, symptoms:[], note:"",
                ts:new Date(d.getTime()+19*3600000).toISOString() };
    if(gut==="rough") e.symptoms = [pick(["Bloating","Bloating","Pain","Loose","Reflux"])];
    if(Math.random()<.28) e.note = pick([
      "Synthetic sample: lunch was later than planned.","Synthetic sample: cooked a simple meal at home.",
      "Synthetic sample: breakfast was missed.","Synthetic sample: breakfast felt more structured today.",
      "Synthetic sample: ate away from home.","Synthetic sample: hydration felt easier today.",
      "Synthetic sample: dinner was later than usual.","Synthetic sample: prepared lunch in advance."]);
    S.entries[k]=e;
  }
  const w1 = key(shift(weekStart(today()),-14)), w2 = key(shift(weekStart(today()),-7));
  S.sitreps[w1] = { week:w1, best:"water", bestText:"Synthetic reflection: hydration felt easiest this week.",
    hardest:"meals", hardText:"Synthetic reflection: meal timing needs more attention.",
    gut:"rough", energy:"low", improve:"meals" };
  S.sitreps[w2] = { week:w2, best:"protein", bestText:"Synthetic reflection: protein felt more consistent.",
    hardest:"snacks", hardText:"Synthetic reflection: evening snacking is worth noticing.",
    gut:"mixed", energy:"updown", improve:"plants" };
  S.coach = [{ ts:shift(today(),-7).toISOString(), action:"Continue Stabilise", note:"" }];
  S.profile.name = S.profile.name || "Synthetic Fixture";
  S.profile.onboarded = true;
  if(!S.baseline) S.baseline = { date:shift(today(),-21).toISOString(),
    answers:{q1:2,q2:3,q3:2,q4:3,q5:2,q6:3,q7:2,q8:3,q9:2,q10:3} };
  S.today = null;
  save(); closeSheet(); go("today"); toast("Demo data loaded — three weeks of sample days.");
}

/* ------------------------------------------------------------------
   22. EVENTS
   ------------------------------------------------------------------ */
document.addEventListener("click", ev => {
  LAST_TRIGGER = ev.target.closest("button");
  const tabBtn = ev.target.closest(".tab");
  if(tabBtn){ if(tabBtn.dataset.tab==="track") DRAFT=null; go(tabBtn.dataset.tab); return; }

  if(ev.target.closest("#coachBtn"))    { coachSheet(); return; }
  if(ev.target.closest("#settingsBtn")) { settingsSheet(); return; }
  if(ev.target.closest("[data-close]")) { closeSheet(); return; }

  const b = ev.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;

  switch(a){

  /* --- onboarding --- */
  case "ob-start": { OB.step = 1; saveOB(); renderOnboarding(); break; }
  case "ob-name": {
    const n = $("#obname"); OB.name = n ? n.value.trim() : "";
    OB.step++; saveOB(); renderOnboarding(); break;
  }
  case "ob-a": {
    const q = BASELINE_Q[qIndex(stepAt(OB.step))];
    if(q) OB.answers[q.id] = Number(b.dataset.v);
    OB.step++; saveOB(); renderOnboarding(); break;
  }
  case "ob-back": {
    const n = $("#obname"); if(n) OB.name = n.value.trim();
    OB.step = Math.max(0, OB.step-1); saveOB(); renderOnboarding(); break;
  }
  case "ob-done": {
    S.profile.name = OB.name || CLIENT.name;
    S.profile.onboarded = true;
    S.baseline = { date:new Date().toISOString(), answers:OB.answers };
    clearOB();
    $("#obroot").hidden = true; $("#obroot").innerHTML="";
    $("#app").hidden = false; go("today");
    toast("Baseline saved. This is yours now.");
    break;
  }

  /* --- tracker --- */
  case "opt": {
    const m = b.dataset.m, val = b.dataset.v;
    DRAFT[m] = DRAFT[m]===val ? undefined : val;
    b.parentElement.querySelectorAll(".opt").forEach(o =>
      o.setAttribute("aria-pressed", String(o.dataset.v===DRAFT[m])));
    if(m==="gut"){
      const rev = $("#symrev");
      if(rev){
        rev.classList.toggle("open", DRAFT.gut==="rough");
        if(DRAFT.gut!=="rough"){
          DRAFT.symptoms = [];
          rev.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
        }
      }
    }
    refreshSave(); break;
  }
  case "why": {
    const box = $("#why-"+b.dataset.m);
    const open = box.classList.toggle("open");
    b.setAttribute("aria-expanded", String(open)); break;
  }
  case "sym": {
    const s = b.dataset.v; DRAFT.symptoms = DRAFT.symptoms||[];
    const i = DRAFT.symptoms.indexOf(s);
    if(i>-1) DRAFT.symptoms.splice(i,1); else DRAFT.symptoms.push(s);
    b.setAttribute("aria-pressed", String(DRAFT.symptoms.includes(s))); break;
  }
  case "save": {
    const note = $("#dnote"); DRAFT.note = note ? note.value.trim() : "";
    if(DRAFT.gut!=="rough") DRAFT.symptoms = [];
    DRAFT.ts = new Date().toISOString();
    const d = DRAFT.date; const rec = Object.assign({}, DRAFT); delete rec.date;
    S.entries[d] = rec; save();
    const wasToday = d===todayKey();
    DRAFT = null;
    if(wasToday){
      /* Straight into whatever today now is — the resolved state if
         there's nothing left, the weekly check-in if there is. */
      JUST_SAVED = true;
      go("today");
      announce(dayShape().resolved ? "Check-in saved. You're done for today."
                                   : "Check-in saved. One thing left today.");
      toast("Captured.");
    } else {
      render();
      /* The row he just wrote lights briefly, so the save lands
         somewhere he can see rather than only in a toast. */
      const row = document.querySelector('.row[data-d="'+d+'"]');
      if(row) row.classList.add("justsaved");
      toast(relDate(d)+" saved.");
      announce(relDate(d)+" saved.");
    }
    break;
  }
  case "edit": {
    const d = b.dataset.d;
    DRAFT = Object.assign({date:d, symptoms:[], note:""}, S.entries[d]||{});
    closeSheet(); go("track"); break;
  }

  /* --- sitrep --- */
  case "sitrep": { SIT = null; sitrepSheet(); break; }
  case "sit-later": {
    S.defer = S.defer || {}; S.defer.sitrep = todayKey(); save();
    SIT = null; closeSheet(); render();
    toast("Left for another day.");
    break;
  }
  case "sit": {
    const f=b.dataset.f, val=b.dataset.v;
    SIT[f] = SIT[f]===val ? "" : val;
    b.parentElement.querySelectorAll(".opt").forEach(o =>
      o.setAttribute("aria-pressed", String(o.dataset.v===SIT[f])));
    const ok = !!(SIT.best&&SIT.hardest&&SIT.gut&&SIT.energy&&SIT.improve);
    const sv = document.querySelector('[data-act="sit-save"]');
    if(sv) sv.disabled = !ok;
    const sh = document.getElementById("sithint");
    if(sh) sh.style.display = ok ? "none" : "";
    break;
  }
  case "sit-save": {
    const bt=$("#sit-best"), ht=$("#sit-hard");
    if(bt) SIT.bestText=bt.value.trim(); if(ht) SIT.hardText=ht.value.trim();
    S.sitreps[SIT.week] = SIT; save();
    const wk = SIT.week; SIT = null;
    closeSheet(); render();
    announce("Weekly check-in saved. Opening your summary.");
    setTimeout(()=>reportSheet(wk), 380); break;
  }

  /* --- reading --- */
  case "report":   reportSheet(b.dataset.w); break;
  case "lesson":   lessonSheet(b.dataset.id); break;
  case "baseline": baselineSheet(); break;
  case "tab":      if(b.dataset.tab==="track") DRAFT=null; closeSheet(); go(b.dataset.tab); break;
  case "close":    closeSheet(); break;

  /* --- coach --- */
  case "coach-act": {
    S.coach.push({ ts:new Date().toISOString(), action:b.dataset.v, note:"" });
    save(); closeSheet(); toast("Recorded: "+b.dataset.v+". Phase 2 stays closed."); break;
  }

  /* --- settings --- */
  case "savename": {
    const n=$("#setname"); const val = n ? n.value.trim() : "";
    S.profile.name = val || CLIENT.name;
    save(); closeSheet(); render(); toast("Saved."); break;
  }
  /* --- body check --- */
  case "body":      { BODY = null; bodySheet(); break; }
  case "body-edit": { BODY = { date:b.dataset.d }; bodySheet(); break; }
  case "body-unit": {
    const f = b.dataset.f, val = b.dataset.v, cur = readBodyFields();
    BODY[f] = val; BODY.touched = true;
    if(f==="weightUnit"){
      if(cur.kg==null){ BODY.w1=""; BODY.w2=""; }
      else if(val==="kg"){ BODY.w1=cur.kg.toFixed(1); BODY.w2=""; }
      else if(val==="lb"){ BODY.w1=(cur.kg/KG_PER_LB).toFixed(1); BODY.w2=""; }
      else { const t=cur.kg/KG_PER_LB, st=Math.floor(t/14);
             BODY.w1=String(st); BODY.w2=(t-st*14).toFixed(1); }
    } else {
      BODY.waist = cur.cm==null ? "" :
        (val==="in" ? (cur.cm/CM_PER_IN).toFixed(1) : cur.cm.toFixed(1));
    }
    bodySheet(); break;
  }
  case "body-save": {
    const f = readBodyFields();
    if(f.kg==null && f.cm==null){ toast("Nothing to save yet — add a weight or a waist measurement."); break; }
    if(f.kg!=null && (f.kg<20 || f.kg>400)){ toast("That weight doesn't look right — please check it."); break; }
    if(f.cm!=null && (f.cm<30 || f.cm>250)){ toast("That waist measurement doesn't look right — please check it."); break; }
    saveBody(BODY.date, { weightKg:f.kg, waistCm:f.cm,
                          weightUnit:BODY.weightUnit, waistUnit:BODY.waistUnit });
    S.prefs.weightUnit = BODY.weightUnit; S.prefs.waistUnit = BODY.waistUnit; save();
    const when = relDate(BODY.date);
    BODY = null; closeSheet(); render();
    toast("Measurement recorded.");
    announce("Measurement recorded for "+when+".");
    break;
  }
  case "body-del": {
    const when = relDate(BODY.date);
    deleteBody(BODY.date); BODY = null; closeSheet(); render();
    toast("Removed.");
    announce("Measurement for "+when+" removed.");
    break;
  }

  /* --- backup --- */
  case "export": {
    const inSettings = SHEET_KIND === "settings";
    if(doExport() && inSettings) settingsSheet();   // the "last saved" line updates
    break;
  }
  case "import": { const f=$("#importfile"); f.value=""; f.click(); break; }
  case "import-go": {
    if(!PENDING){ closeSheet(); break; }
    S = PENDING; PENDING = null; save();
    OB = {step:0,name:CLIENT.name,answers:{}}; DRAFT=null; SIT=null; BODY=null;
    closeSheet();
    if(!S.profile.onboarded){ renderOnboarding(); }
    else { $("#obroot").hidden=true; $("#obroot").innerHTML=""; $("#app").hidden=false; go("today"); }
    toast("Restored from backup.");
    announce("Restored from backup.");
    break;
  }

  /* --- destructive, deliberately several steps from anything ordinary --- */
  case "demo-confirm":  demoSheet();  break;
  case "demo":          loadDemo();   break;
  case "reset-confirm": resetSheet(); break;
  case "reset-go": {
    Store.clear(); S = load();
    OB = {step:0,name:CLIENT.name,answers:{}}; DRAFT=null; SIT=null; BODY=null; PENDING=null;
    AWAY_DAYS = 0;
    closeSheet(); renderOnboarding();
    toast("Erased. This device is back to the beginning.");
    break;
  }
  }
});

document.addEventListener("keydown", e => {
  if(e.key==="Escape" && $("#sheetwrap").classList.contains("open")){ closeSheet(); return; }
  if(e.key==="Enter" && e.target && e.target.id==="obname"){
    e.preventDefault();
    const n=$("#obname"); OB.name = n ? n.value.trim() : "";
    OB.step++; saveOB(); renderOnboarding(); return;
  }
  trapFocus(e);
});

/* Restoring is the one place the app reads something it did not write.
   Everything is validated before the live store is touched. */
document.getElementById("importfile").addEventListener("change", ev => {
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(file.size > 8*1024*1024){
    importSheet({ ok:false, error:"That file is far larger than a Companion backup should be." });
    return;
  }
  const fr = new FileReader();
  fr.onload  = () => importSheet(validateBackup(String(fr.result)));
  fr.onerror = () => importSheet({ ok:false, error:"That file couldn't be read from your device." });
  fr.readAsText(file);
});

/* ------------------------------------------------------------------
   23. BOOT
   ------------------------------------------------------------------ */
(function boot(){
  noteOpen();
  if(!S.profile.onboarded){
    /* Pick up a baseline that was interrupted — a locked phone should
       not cost him ten questions. */
    const d = S.obDraft;
    if(d && typeof d.step === "number"){
      OB = { step: Math.max(0, Math.min(d.step, OB_STEPS.length-1)),
             name: d.name || CLIENT.name,
             answers: (d.answers && typeof d.answers === "object") ? d.answers : {} };
    }
    renderOnboarding();
    return;
  }
  $("#obroot").hidden = true;
  $("#app").hidden = false;
  go("today");
  /* Storage refusing to work is stated on Today as a designed card
     rather than a toast that scrolls away before it is read. */
})();
</script>
</body>
